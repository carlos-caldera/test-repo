name: Test dispatch
on:
  workflow_dispatch:
    inputs:
      val-one:
        required: true
      val-two:
        type: boolean
        required: true

jobs:
  test-job-1:
    runs-on: ubuntu-latest
    steps:
      - name: Echo inputs
        run: echo '${{ toJSON(inputs) }}'

      - name: Dump GitHub context
        run: echo '${{ toJSON(github) }}'

  test-job-2:
    needs: test-job-1
    uses: ./.github/workflows/env-sleep.yaml
    with:
      flag: ${{ inputs.val-two }}

  test-job-3:
    runs-on: ubuntu-latest
    needs: [test-job-1, test-job-2]
    steps:
      - name: Echo inputs
        run: echo '${{ toJSON(inputs) }}'

      - name: Dump GitHub context
        run: echo '${{ toJSON(github) }}'
