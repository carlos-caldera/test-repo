name: Env Sleep
permissions:
  contents: read
  id-token: write
  actions: write
on:
  workflow_call:
    inputs:
      flag:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      flag:
        required: true
        type: boolean

jobs:
  init:
    runs-on: ubuntu-latest
    steps:
      - name: Echo inputs
        run: echo '${{ toJSON(inputs) }}'

      - name: Echo init
        run: echo "init"

  post-sleep:
    runs-on: ubuntu-latest
    needs: init
    if: inputs.flag
    steps:
      - name: Echo inputs
        run: echo '${{ toJSON(inputs) }}'

      - name: Echo post
        run: echo "post"
